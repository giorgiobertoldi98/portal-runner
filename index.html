<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Portal Runner</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="vignette"></div>

<div id="hud" class="hidden">
  <!-- top left: the world chip, with your lives just beside it -->
  <div class="hud-tl">
    <div class="world-chip panel">
      <div id="level" class="lvl"></div>
      <div class="gems">
        <img class="gem-icon" id="gem-icon" alt="">
        <span id="gem-count">0 / 0</span><span class="unit" data-i18n="hud.inPortal"></span>
      </div>
    </div>
    <div id="lives"></div>
  </div>
  <div class="hud-tr">
    <button id="btn-mute" class="icon-btn" data-i18n-aria="hud.sound">
      <svg class="on" viewBox="0 0 24 24" width="20" height="20"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg class="off" viewBox="0 0 24 24" width="20" height="20"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="m16 9 6 6m0-6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button id="btn-pause" class="icon-btn" data-i18n-aria="hud.pause">
      <svg viewBox="0 0 24 24" width="20" height="20"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
  </div>
  <div id="banner"><div id="banner-name"></div><div id="banner-tag"></div></div>
  <div id="toast"></div>
  <div id="call-chip"><span id="call-text" data-i18n="hud.calling"></span><div class="bar"><i id="call-bar"></i></div></div>
  <!-- the explorer's tools, on PC and touch alike: your items as a slot bar at the bottom centre, Drop gem as a
       separate round button (beside the bar on PC, above the look pad on touch) and the contextual action (top half) -->
  <div id="tools">
    <!-- your items (things you hold up to read), gathered as you find them in a world: the wheel (or 1-9) picks one,
         Space or a tap opens it -->
    <div id="items" class="none">
    <!-- PC only: a quiet key hint left of the bar: the wheel (once there are several items) | Space -->
    <div id="item-keys" aria-hidden="true">
      <svg class="pick" viewBox="0 0 24 24" width="13" height="13"><rect x="7" y="3" width="10" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 7v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="sep pick"></span><kbd data-key="space"></kbd>
    </div>
    <div id="item-label"><span id="item-name"></span></div>
    <button id="btn-note" class="tool item" data-i18n-aria="hud.note" data-i18n-title="hud.note">
      <svg viewBox="0 0 24 24" width="21" height="21"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 7.5h6M9 10.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".7"/></svg>
    </button>
    <button id="btn-map" class="tool item" data-i18n-aria="hud.map" data-i18n-title="hud.map">
      <svg viewBox="0 0 24 24" width="21" height="21"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 4v13.5M15 6.5V20" stroke="currentColor" stroke-width="1.5" opacity=".7"/></svg>
    </button>
    </div>
    <!-- Drop gem: this world's gem, with the number you carry; on PC its key (Q) sits just below it -->
    <button id="btn-drop" class="tool" data-i18n-aria="hud.dropGemAria" data-i18n-title="hud.dropGemTitle">
      <img class="gem-icon" id="drop-icon" alt=""><span class="tl" data-i18n="hud.dropGem"></span><kbd data-key="q"></kbd><b class="n" id="drop-n"></b>
    </button>
    <button id="btn-act" class="tool act" data-i18n-aria="hud.action">
      <span class="ico"></span><span class="tl" id="act-label"></span><kbd id="act-key" data-key="space"></kbd>
    </button>
  </div>
  <div id="joystick">
    <svg class="joy-arrows" viewBox="0 0 100 100"><path d="M50 9 43 18h14zM50 91l-7-9h14zM9 50l9-7v14zM91 50l-9-7v14z"/></svg>
    <div id="joy-knob"></div>
    
  </div>
  <div id="lookpad">
    <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="9"/><path d="M50 14 43 24h14zM50 86l-7-10h14zM14 50l10-7v14zM86 50l-10-7v14z"/></svg>
    
  </div>
</div>
<div id="fade"></div>

<div id="screen-loading" class="screen paper">
  <div class="loader"><div class="spinner"></div><div data-i18n="loading"></div></div>
</div>

<div id="screen-menu" class="screen paper landing hidden">
  <div class="landing-copy">
    <h1 class="title" data-i18n="title"></h1>
    <p class="lead" data-i18n="menu.lead"></p>
    <ul class="loop" data-i18n-aria="menu.loopLabel">
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".6"/></svg><span data-i18n="menu.loop1"></span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 6 10l6 11 6-11z"/></svg><span data-i18n="menu.loop2"></span></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V10a6 6 0 0 1 12 0v11" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 21v-9a3 3 0 0 1 6 0v9z" opacity=".55"/></svg><span data-i18n="menu.loop3"></span></li>
    </ul>
    <div class="actions">
      <button class="primary" id="btn-start" data-i18n="menu.start"></button>
      <button class="ghost" id="btn-settings" data-i18n="menu.settings"></button>
    </div>
  </div>
  <!-- the void between worlds, drawn in ink and wash (ui/menuArt.js) -->
  <div class="landing-art" id="menu-art"></div>
</div>

<!-- Settings: a page in the same drawn style as the menu. The tabs (General, then one per world) and the page's own
     buttons stay on the left; the settings of the chosen tab fill the right and scroll there if they don't fit -->
<div id="screen-settings" class="screen paper hidden">
  <div class="settings">
    <aside class="set-side">
      <h2 data-i18n="settings.title"></h2>
      <nav class="set-tabs" id="set-tabs"></nav>
      <div class="set-foot">
        <p class="hint" data-i18n="settings.applyNext"></p>
        <button class="primary" id="set-done" data-i18n="settings.done"></button>
        <button class="ghost" id="set-reset" data-i18n="settings.reset"></button>
      </div>
    </aside>
    <section class="set-body" id="set-body">
      <h3 class="set-head" id="set-head"></h3>
      <div class="set-grid">
        <div id="set-general">
          <div class="setting"><span data-i18n="settings.footsteps"></span><button class="switch opt-steps" role="switch" aria-checked="true" data-i18n-aria="settings.footsteps"><i></i></button></div>
          <div class="setting"><div class="txt"><span data-i18n="settings.debug"></span><small data-i18n="settings.debugHint"></small></div><button class="switch opt-debug" role="switch" aria-checked="false" data-i18n-aria="settings.debug"><i></i></button></div>
          <div class="setting hidden" id="set-lang"><span data-i18n="settings.language"></span><div class="seg"></div></div>
        </div>
        <div id="set-list"></div>
      </div>
    </section>
  </div>
</div>

<div id="screen-pause" class="screen hidden">
  <div class="card small paper">
    <h2 data-i18n="pause.title"></h2>
    <div class="setting"><span data-i18n="settings.footsteps"></span><button class="switch opt-steps" role="switch" aria-checked="true" data-i18n-aria="settings.footsteps"><i></i></button></div>
    <button class="primary" id="btn-resume" data-i18n="pause.resume"></button>
    <button class="ghost" id="btn-quit" data-i18n="pause.quit"></button>
  </div>
</div>

<div id="screen-end" class="screen hidden">
  <div class="card small paper">
    <h2 id="end-title"></h2>
    <p class="lead" id="end-text"></p>
    <div class="stats" id="end-stats"></div>
    <button class="primary" id="btn-again" data-i18n="end.again"></button>
    <button class="ghost" id="btn-menu" data-i18n="end.menu"></button>
  </div>
</div>

<!-- the game is landscape only: on a screen taller than it is wide this covers everything and the run pauses -->
<div id="rotate" role="alert" aria-live="assertive">
  <div class="rot-box">
    <svg class="rot-phone" viewBox="0 0 64 64" aria-hidden="true"><rect x="20" y="8" width="24" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="32" cy="46" r="2"/></svg>
    <h2 data-i18n="rotate.title"></h2>
    <p class="mob" data-i18n="rotate.touch"></p>
    <p class="desk" data-i18n="rotate.pc"></p>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
